<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDEAS TEXTILES | Sistema Maestro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ESTILOS DE BASE */
        :root { --primary: #1e293b; --blue: #2563eb; --bg: #f1f5f9; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #334155; user-select: none; }

        /* UI ELEMENTS */
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card { background: white; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; transition: transform 0.1s; }
        .card:active { transform: scale(0.99); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-blue { background: var(--blue); color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        
        .input-std { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: #f8fafc; font-weight: 500; }
        .input-std:focus { background: white; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* CALENDARIO AVANZADO */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #cbd5e1; border: 1px solid #cbd5e1; border-radius: 0 0 12px 12px; overflow: hidden; }
        .cal-cell { background: white; min-height: 90px; padding: 4px; position: relative; cursor: pointer; transition: background 0.2s; }
        .cal-cell:hover { background: #f8fafc; }
        .cal-cell.today { background: #eff6ff; }
        .cal-num { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 4px; display: block; }
        .cal-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 2px; }
        .cal-note { background: #fef08a; color: #854d0e; font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* LOADING */
        .loader-overlay { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-col; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-24 md:pb-0 md:pl-64">

    <div id="loader" class="loader-overlay">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full spin mb-4"></div>
        <p class="text-xs font-bold text-slate-400 tracking-widest">CONECTANDO A FIREBASE...</p>
    </div>

    <aside class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-slate-900 text-white flex-col z-50">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-2xl font-black italic">IDEAS<span class="text-blue-500">.</span></h1>
            <div class="flex items-center gap-2 mt-2">
                <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                <span class="text-[10px] font-bold text-slate-400">EN LÍNEA</span>
            </div>
        </div>
        <nav class="p-4 space-y-2">
            <button onclick="App.Router.go('dashboard')" class="w-full text-left p-3 rounded-lg hover:bg-white/5 transition flex items-center gap-3 font-medium text-slate-300 active-nav"><i class="fas fa-grid-2 w-5"></i> Dashboard</button>
            <button onclick="App.Router.go('orders')" class="w-full text-left p-3 rounded-lg hover:bg-white/5 transition flex items-center gap-3 font-medium text-slate-300"><i class="fas fa-file-invoice w-5"></i> Órdenes</button>
            <button onclick="App.Router.go('inventory')" class="w-full text-left p-3 rounded-lg hover:bg-white/5 transition flex items-center gap-3 font-medium text-slate-300"><i class="fas fa-boxes-stacked w-5"></i> Bodega</button>
        </nav>
    </aside>

    <header class="md:hidden sticky top-0 bg-white/90 backdrop-blur border-b z-40 px-4 py-3 flex justify-between items-center">
        <span class="font-black text-lg text-slate-800">IDEAS<span class="text-blue-600">APP</span></span>
        <button onclick="location.reload()" class="p-2 text-slate-400 active:text-blue-600"><i class="fas fa-sync-alt"></i></button>
    </header>

    <main class="p-4 md:p-8 max-w-7xl mx-auto">

        <div id="view-dashboard" class="view-section animate-fade">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-slate-800 self-start md:self-center">Calendario de Producción</h2>
                <div class="flex items-center gap-2 bg-white p-1 rounded-lg border shadow-sm">
                    <button onclick="App.Actions.Calendar.move(-1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-100 rounded"><i class="fas fa-chevron-left"></i></button>
                    <span id="cal-title" class="px-4 font-bold text-sm w-32 text-center">Cargando...</span>
                    <button onclick="App.Actions.Calendar.move(1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-100 rounded"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="grid grid-cols-7 text-center py-2 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b">
                    <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
                </div>
                <div id="calendar-grid" class="cal-grid">
                    </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                <div class="card p-4 border-l-4 border-blue-500">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Activos</p>
                    <h3 id="kpi-active" class="text-2xl font-black text-slate-800">0</h3>
                </div>
                <div class="card p-4 border-l-4 border-red-500">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Problemas</p>
                    <h3 id="kpi-issues" class="text-2xl font-black text-red-600">0</h3>
                </div>
            </div>
        </div>

        <div id="view-orders" class="view-section hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Órdenes</h2>
                <button onclick="App.Actions.Orders.openModal()" class="btn btn-blue text-sm shadow-lg">
                    <i class="fas fa-plus mr-2"></i> NUEVA
                </button>
            </div>

            <div class="mb-6 relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="search-order" onkeyup="App.Render.orders()" class="input-std pl-10" placeholder="Buscar por cliente, número o factura...">
            </div>

            <div id="orders-list" class="grid grid-cols-1 gap-3">
                </div>
        </div>

        <div id="view-inventory" class="view-section hidden">
             <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Bodega</h2>
                <button onclick="App.Actions.Inventory.add()" class="btn bg-slate-800 text-white text-sm">
                    <i class="fas fa-plus mr-2"></i> ITEM
                </button>
            </div>
            <div id="inventory-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                </div>
        </div>

    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white/95 backdrop-blur border-t z-50 flex justify-around py-3 pb-safe">
        <button onclick="App.Router.go('dashboard')" class="flex flex-col items-center w-16 text-blue-600 nav-btn" data-target="dashboard">
            <i class="fas fa-calendar-alt text-xl mb-1"></i>
            <span class="text-[9px] font-bold">AGENDA</span>
        </button>
        <button onclick="App.Router.go('orders')" class="flex flex-col items-center w-16 text-slate-400 nav-btn" data-target="orders">
            <i class="fas fa-file-invoice text-xl mb-1"></i>
            <span class="text-[9px] font-bold">ORDEN</span>
        </button>
        <button onclick="App.Router.go('inventory')" class="flex flex-col items-center w-16 text-slate-400 nav-btn" data-target="inventory">
            <i class="fas fa-boxes-stacked text-xl mb-1"></i>
            <span class="text-[9px] font-bold">STOCK</span>
        </button>
    </nav>

    <div id="modal-order" class="fixed inset-0 bg-slate-900/80 z-[60] hidden flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-sm">
        <div class="bg-white w-full md:max-w-3xl h-[95vh] md:h-auto rounded-t-2xl md:rounded-2xl flex flex-col shadow-2xl overflow-hidden animate-slideUp">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-lg text-slate-800">Gestión de Orden</h3>
                <button onclick="document.getElementById('modal-order').classList.add('hidden')" class="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <div class="grid grid-cols-3 gap-3">
                    <div><label class="text-xs font-bold text-slate-400">N°</label><input id="o-num" type="number" class="input-std font-bold text-blue-600"></div>
                    <div class="col-span-2"><label class="text-xs font-bold text-slate-400">CLIENTE</label><input id="o-client" type="text" class="input-std font-bold"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-xs font-bold text-slate-400">FECHA ENTREGA</label><input id="o-date" type="date" class="input-std"></div>
                    <div><label class="text-xs font-bold text-slate-400">FACTURA</label><input id="o-inv" type="text" class="input-std"></div>
                </div>
                
                <div class="bg-slate-50 p-3 rounded-lg border">
                    <div class="flex justify-between mb-2"><span class="text-xs font-bold text-slate-400">PRODUCTOS</span><button onclick="App.UI.addRow()" class="text-blue-600 text-xs font-bold">+ AGREGAR</button></div>
                    <div id="items-rows" class="space-y-2"></div>
                </div>

                <div><label class="text-xs font-bold text-slate-400">NOTAS</label><textarea id="o-notes" class="input-std h-20 resize-none"></textarea></div>

                <button id="btn-delete-order" onclick="App.Actions.Orders.delete()" class="hidden w-full py-3 text-red-500 font-bold border border-red-100 rounded-lg hover:bg-red-50"><i class="fas fa-trash mr-2"></i> ELIMINAR ORDEN</button>
            </div>
            <div class="p-4 border-t"><button onclick="App.Actions.Orders.save()" class="btn btn-blue w-full text-lg shadow-xl">GUARDAR CAMBIOS</button></div>
        </div>
    </div>

    <div id="modal-cal" class="fixed inset-0 bg-slate-900/80 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 shadow-2xl">
            <h3 class="font-bold text-lg mb-1">Nota del Día</h3>
            <p id="cal-date-display" class="text-sm text-slate-400 mb-4">...</p>
            <input id="cal-note-input" class="input-std mb-4" placeholder="Ej: Mantenimiento, Llegada Hilo...">
            <div class="flex gap-2">
                <button onclick="document.getElementById('modal-cal').classList.add('hidden')" class="flex-1 btn bg-slate-100 text-slate-600">Cancelar</button>
                <button onclick="App.Actions.Calendar.saveNote()" class="flex-1 btn btn-blue">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        // === CONFIGURACIÓN ===
        const firebaseConfig = {
            apiKey: "AIzaSyBg-Cx9SqZw35TyyMxtpVBEFlwZTjBXBew",
            authDomain: "ideastextilesapp.firebaseapp.com",
            databaseURL: "https://ideastextilesapp-default-rtdb.firebaseio.com",
            projectId: "ideastextilesapp",
            storageBucket: "ideastextilesapp.firebasestorage.app",
            messagingSenderId: "268995530035",
            appId: "1:268995530035:web:1890f45ac761cc81eb0246"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // === ESTADO GLOBAL ===
        const State = {
            orders: [],
            inventory: [],
            calendar: {},
            currentDate: new Date(),
            editingId: null,
            editingDateKey: null
        };

        // === ACCIONES ===
        const Actions = {
            Calendar: {
                move: (delta) => {
                    State.currentDate.setMonth(State.currentDate.getMonth() + delta);
                    Render.calendar();
                },
                clickDay: (dateStr) => {
                    State.editingDateKey = dateStr;
                    document.getElementById('cal-date-display').innerText = dateStr;
                    document.getElementById('cal-note-input').value = State.calendar[dateStr] || '';
                    document.getElementById('modal-cal').classList.remove('hidden');
                },
                saveNote: async () => {
                    const val = document.getElementById('cal-note-input').value;
                    if(val) await setDoc(doc(db, "calendar", State.editingDateKey), { note: val });
                    else await deleteDoc(doc(db, "calendar", State.editingDateKey));
                    document.getElementById('modal-cal').classList.add('hidden');
                }
            },
            Orders: {
                openModal: (id = null) => {
                    State.editingId = id;
                    const delBtn = document.getElementById('btn-delete-order');
                    document.getElementById('items-rows').innerHTML = ''; // Limpiar

                    if (id) {
                        const o = State.orders.find(x => x.id === id);
                        document.getElementById('o-num').value = o.number;
                        document.getElementById('o-client').value = o.client;
                        document.getElementById('o-date').value = o.date;
                        document.getElementById('o-inv').value = o.invoice || '';
                        document.getElementById('o-notes').value = o.notes || '';
                        (o.items || []).forEach(i => UI.addRow(i.prod, i.qty));
                        delBtn.classList.remove('hidden');
                    } else {
                        document.querySelectorAll('#modal-order input, #modal-order textarea').forEach(i => i.value = '');
                        UI.addRow(); // Fila vacía
                        delBtn.classList.add('hidden');
                    }
                    document.getElementById('modal-order').classList.remove('hidden');
                },
                save: async () => {
                    try {
                        const data = {
                            number: document.getElementById('o-num').value,
                            client: document.getElementById('o-client').value,
                            date: document.getElementById('o-date').value,
                            invoice: document.getElementById('o-inv').value,
                            notes: document.getElementById('o-notes').value,
                            items: [],
                            updatedAt: serverTimestamp()
                        };

                        document.querySelectorAll('.item-row').forEach(r => {
                            const p = r.querySelector('.i-prod').value;
                            const q = r.querySelector('.i-qty').value;
                            if(p) data.items.push({prod:p, qty:q});
                        });

                        if (!data.number || !data.client) throw new Error("Faltan datos (N° o Cliente)");

                        if (State.editingId) {
                            await updateDoc(doc(db, "orders", State.editingId), data);
                        } else {
                            data.status = "Pendiente";
                            await addDoc(collection(db, "orders"), data);
                        }
                        document.getElementById('modal-order').classList.add('hidden');
                        Swal.fire({icon:'success', title:'Guardado', toast:true, position:'top-end', timer:1500, showConfirmButton:false});
                    } catch (e) {
                        Swal.fire("Error", e.message, "warning");
                    }
                },
                delete: async () => {
                    if (await Swal.fire({title:'¿Eliminar?', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, borrar'}).then(r => r.isConfirmed)) {
                        await deleteDoc(doc(db, "orders", State.editingId));
                        document.getElementById('modal-order').classList.add('hidden');
                    }
                },
                changeStatus: async (id, type) => {
                    const isIssue = type === 'issue';
                    const { value: file } = await Swal.fire({
                        title: isIssue ? 'Reportar Falla' : 'Despachar Orden',
                        text: 'Sube una foto de evidencia para continuar.',
                        input: 'file',
                        showCancelButton: true
                    });

                    if (file) {
                        Swal.showLoading();
                        const imgRef = ref(storage, `evidence/${Date.now()}_${file.name}`);
                        await uploadBytes(imgRef, file);
                        const url = await getDownloadURL(imgRef);
                        
                        await updateDoc(doc(db, "orders", id), {
                            status: isIssue ? 'Problema' : 'Despachado',
                            evidence: url
                        });
                        Swal.fire("Listo", "Estado actualizado correctamente", "success");
                    }
                }
            },
            Inventory: {
                add: async () => {
                    const { value: name } = await Swal.fire({title:'Nuevo Item', input:'text', inputPlaceholder:'Nombre de la tela/prenda'});
                    if(name) await addDoc(collection(db, "inventory"), { name, stock: 0 });
                },
                update: async (id, current) => {
                    const { value: qty } = await Swal.fire({title:'Ajustar Stock', input:'number', inputValue: current});
                    if(qty) await updateDoc(doc(db, "inventory", id), { stock: Number(qty) });
                }
            }
        };

        // === RENDERIZADO UI ===
        const UI = {
            addRow: (p='', q='') => {
                const div = document.createElement('div');
                div.className = 'item-row flex gap-2';
                div.innerHTML = `<input class="i-prod input-std text-sm" placeholder="Prod" value="${p}"><input class="i-qty input-std w-20 text-center" type="number" placeholder="#" value="${q}">`;
                document.getElementById('items-rows').appendChild(div);
            }
        };

        const Render = {
            calendar: () => {
                const y = State.currentDate.getFullYear();
                const m = State.currentDate.getMonth();
                const firstDay = new Date(y, m, 1).getDay();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
                
                document.getElementById('cal-title').innerText = `${months[m]} ${y}`;
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = '';

                // Celdas vacías
                for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="cal-cell bg-slate-100"></div>`;

                // Días
                for(let d=1; d<=daysInMonth; d++) {
                    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const note = State.calendar[dateStr];
                    const orders = State.orders.filter(o => o.date === dateStr);
                    const isToday = new Date().toISOString().split('T')[0] === dateStr;

                    let html = `<div onclick="App.Actions.Calendar.clickDay('${dateStr}')" class="cal-cell ${isToday ? 'today' : ''}">`;
                    html += `<span class="cal-num">${d}</span>`;
                    if(note) html += `<div class="cal-note">${note}</div>`;
                    
                    orders.forEach(o => {
                        const color = o.status === 'Problema' ? 'bg-red-500' : (o.status==='Despachado' ? 'bg-green-500' : 'bg-blue-500');
                        html += `<div class="text-[9px] truncate text-slate-500"><span class="cal-dot ${color}"></span>#${o.number}</div>`;
                    });
                    
                    html += `</div>`;
                    grid.innerHTML += html;
                }
            },
            orders: () => {
                const term = document.getElementById('search-order').value.toLowerCase();
                const list = document.getElementById('orders-list');
                list.innerHTML = '';
                
                const filtered = State.orders.filter(o => 
                    (o.client||'').toLowerCase().includes(term) || (o.number||'').includes(term)
                ).sort((a,b) => (a.number < b.number ? 1 : -1));

                filtered.forEach(o => {
                    let stClass = "bg-yellow-100 text-yellow-700";
                    let stIcon = "fa-clock";
                    if(o.status === 'Despachado') { stClass = "bg-green-100 text-green-700"; stIcon = "fa-check"; }
                    if(o.status === 'Problema') { stClass = "bg-red-100 text-red-700"; stIcon = "fa-triangle-exclamation"; }

                    list.innerHTML += `
                        <div class="card p-4 flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-bold text-slate-400 text-xs">#${o.number}</span>
                                    <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase flex items-center gap-1 ${stClass}"><i class="fas ${stIcon}"></i> ${o.status}</span>
                                </div>
                                <h3 class="font-bold text-lg leading-none">${o.client}</h3>
                                <p class="text-xs text-slate-500 mt-1"><i class="far fa-calendar mr-1"></i> ${o.date} | Items: ${(o.items||[]).length}</p>
                            </div>
                            <div class="flex gap-2 w-full md:w-auto">
                                <button onclick="App.Actions.Orders.changeStatus('${o.id}', 'issue')" class="flex-1 py-2 px-3 bg-red-50 text-red-500 rounded border border-red-100 font-bold text-xs"><i class="fas fa-bug"></i></button>
                                <button onclick="App.Actions.Orders.openModal('${o.id}')" class="flex-1 py-2 px-4 bg-white border text-slate-600 rounded font-bold text-xs shadow-sm">EDITAR</button>
                                ${o.status !== 'Despachado' ? `<button onclick="App.Actions.Orders.changeStatus('${o.id}', 'ok')" class="flex-1 py-2 px-4 bg-slate-800 text-white rounded font-bold text-xs shadow-lg">DESPACHAR</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                // KPIs
                document.getElementById('kpi-active').innerText = State.orders.filter(o => o.status !== 'Despachado').length;
                document.getElementById('kpi-issues').innerText = State.orders.filter(o => o.status === 'Problema').length;
            },
            inventory: () => {
                const list = document.getElementById('inventory-list');
                list.innerHTML = '';
                State.inventory.forEach(i => {
                    list.innerHTML += `
                        <div onclick="App.Actions.Inventory.update('${i.id}', ${i.stock})" class="card p-4 text-center cursor-pointer hover:border-blue-400">
                            <h4 class="font-bold text-sm truncate">${i.name}</h4>
                            <div class="text-2xl font-black text-slate-700 mt-2">${i.stock}</div>
                            <div class="text-[10px] text-slate-400 uppercase font-bold">Unidades</div>
                        </div>
                    `;
                });
            }
        };

        const Router = {
            go: (id) => {
                document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
                document.getElementById(`view-${id}`).classList.remove('hidden');
                document.querySelectorAll('.nav-btn, .active-nav').forEach(b => {
                    if(b.dataset.target === id) b.classList.add('text-blue-600', 'active-nav');
                    else b.classList.remove('text-blue-600', 'active-nav');
                });
            }
        };

        // === INICIALIZACIÓN ===
        // 1. Escuchar Ordenes
        onSnapshot(collection(db, "orders"), (snap) => {
            State.orders = snap.docs.map(d => ({id:d.id, ...d.data()}));
            Render.orders();
            Render.calendar(); // Refrescar calendario para mostrar puntos
            document.getElementById('loader').style.opacity = '0';
            setTimeout(()=>document.getElementById('loader').remove(), 500);
        });

        // 2. Escuchar Calendario
        onSnapshot(collection(db, "calendar"), (snap) => {
            State.calendar = {};
            snap.forEach(d => State.calendar[d.id] = d.data().note);
            Render.calendar();
        });

        // 3. Escuchar Inventario
        onSnapshot(collection(db, "inventory"), (snap) => {
            State.inventory = snap.docs.map(d => ({id:d.id, ...d.data()}));
            Render.inventory();
        });

        // Exponer al DOM
        window.App = { Actions, UI, Render, Router };
    </script>
</body>
</html>
