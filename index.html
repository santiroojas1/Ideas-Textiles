<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ideas Textiles APP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F2F2F7; -webkit-tap-highlight-color: transparent; }
        .ios-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); transition: transform 0.2s; }
        .ios-input { background: #F2F2F7; border-radius: 12px; padding: 14px; width: 100%; outline: none; transition: all 0.2s; font-size: 16px; }
        .ios-input:focus { background: white; box-shadow: 0 0 0 2px #3B82F6; }
        .tap-effect:active { transform: scale(0.96); opacity: 0.8; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Ocultar scrollbar pero permitir scroll */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 md:pb-0 md:pl-72 text-slate-800">

    <div id="app-loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader w-12 h-12 border-4 border-blue-600 border-t-transparent"></div>
        <p class="mt-4 text-xs font-bold text-slate-400 tracking-widest">CARGANDO SISTEMA...</p>
    </div>

    <aside class="hidden md:flex fixed left-0 top-0 h-full w-72 bg-slate-900 text-white flex-col z-50 shadow-2xl">
        <div class="p-8">
            <h1 class="text-3xl font-black tracking-tighter">IDEAS<span class="text-blue-500">TEXTILES</span></h1>
            <p class="text-[10px] text-slate-400 font-bold tracking-[0.2em] mt-2">SYSTEM OS v4.0</p>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <button onclick="App.UI.navigate('dashboard')" class="nav-btn w-full text-left p-4 rounded-xl font-bold text-slate-400 hover:bg-white/10 hover:text-white transition-all flex items-center gap-4">
                <i class="fas fa-chart-pie w-5 text-center"></i> Panorama
            </button>
            <button onclick="App.UI.navigate('orders')" class="nav-btn w-full text-left p-4 rounded-xl font-bold text-slate-400 hover:bg-white/10 hover:text-white transition-all flex items-center gap-4">
                <i class="fas fa-file-invoice w-5 text-center"></i> Órdenes
            </button>
            <button onclick="App.UI.navigate('inventory')" class="nav-btn w-full text-left p-4 rounded-xl font-bold text-slate-400 hover:bg-white/10 hover:text-white transition-all flex items-center gap-4">
                <i class="fas fa-boxes w-5 text-center"></i> Bodega
            </button>
        </nav>
    </aside>

    <header class="md:hidden sticky top-0 bg-white/90 backdrop-blur-md border-b border-slate-200 z-40 px-5 py-4 flex justify-between items-center">
        <h1 class="font-black text-xl leading-none">IDEAS <span class="text-blue-600">APP</span></h1>
        <div id="connection-status" class="w-2 h-2 rounded-full bg-green-500"></div>
    </header>

    <main class="p-4 md:p-10 max-w-7xl mx-auto min-h-screen">
        
        <div id="view-dashboard" class="view-section animate-fade-in">
            <h2 class="text-3xl font-bold mb-6">Agenda de Producción</h2>
            <div class="ios-card p-4 md:p-8 mb-6 overflow-hidden">
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 md:gap-3"></div>
            </div>
            <h3 class="font-bold text-slate-500 text-sm uppercase mb-4">Próximas Entregas</h3>
            <div id="upcoming-list" class="space-y-3"></div>
        </div>

        <div id="view-orders" class="view-section hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold">Órdenes</h2>
                <button onclick="App.Logic.Orders.create()" class="bg-blue-600 text-white px-5 py-2.5 rounded-full font-bold shadow-lg shadow-blue-500/30 tap-effect">
                    <i class="fas fa-plus mr-2"></i>Nueva
                </button>
            </div>
            <div class="relative mb-6">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
                <input type="text" id="search-orders" onkeyup="App.UI.renderOrders()" placeholder="Buscar cliente, orden..." class="ios-input pl-12">
            </div>
            <div id="orders-list" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="view-inventory" class="view-section hidden">
            <h2 class="text-3xl font-bold mb-6">Bodega Digital</h2>
            <div class="flex p-1 bg-slate-200 rounded-xl mb-6">
                <button onclick="App.Logic.Inventory.switchTab('prendas')" id="tab-prendas" class="flex-1 py-2 rounded-lg font-bold text-sm bg-white shadow transition-all">PRENDAS</button>
                <button onclick="App.Logic.Inventory.switchTab('telas')" id="tab-telas" class="flex-1 py-2 rounded-lg font-bold text-sm text-slate-500 transition-all">TELAS</button>
            </div>
            <button onclick="App.Logic.Inventory.createProduct()" class="w-full mb-6 py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 font-bold hover:bg-slate-50">+ Agregar Nuevo Producto</button>
            <div id="inventory-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

    </main>

    <nav class="md:hidden bottom-nav flex justify-around py-3 px-2">
        <button onclick="App.UI.navigate('dashboard')" class="flex flex-col items-center gap-1 w-16 text-blue-600 nav-mobile" data-target="dashboard">
            <i class="fas fa-chart-pie text-xl"></i><span class="text-[10px] font-bold">Inicio</span>
        </button>
        <button onclick="App.UI.navigate('orders')" class="flex flex-col items-center gap-1 w-16 text-slate-400 nav-mobile" data-target="orders">
            <i class="fas fa-file-invoice text-xl"></i><span class="text-[10px] font-bold">Órdenes</span>
        </button>
        <button onclick="App.UI.navigate('inventory')" class="flex flex-col items-center gap-1 w-16 text-slate-400 nav-mobile" data-target="inventory">
            <i class="fas fa-boxes text-xl"></i><span class="text-[10px] font-bold">Bodega</span>
        </button>
    </nav>

    <div id="universal-modal" class="fixed inset-0 bg-slate-900/80 z-[60] hidden backdrop-blur-sm flex items-end md:items-center justify-center">
        <div class="bg-white w-full md:max-w-3xl h-[95vh] md:h-auto md:max-h-[90vh] rounded-t-3xl md:rounded-3xl flex flex-col shadow-2xl overflow-hidden animate-slide-up">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white z-10">
                <h3 class="font-black text-xl text-slate-800" id="modal-title">...</h3>
                <button onclick="App.UI.closeModal()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 tap-effect flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="flex-1 overflow-y-auto p-6 bg-slate-50"></div>
            <div id="modal-footer" class="p-4 bg-white border-t border-slate-100"></div>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // CAPA 0: CONFIGURACIÓN Y LIBRERÍAS
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, deleteDoc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBg-Cx9SqZw35TyyMxtpVBEFlwZTjBXBew",
            authDomain: "ideastextilesapp.firebaseapp.com",
            databaseURL: "https://ideastextilesapp-default-rtdb.firebaseio.com",
            projectId: "ideastextilesapp",
            storageBucket: "ideastextilesapp.firebasestorage.app",
            messagingSenderId: "268995530035",
            appId: "1:268995530035:web:1890f45ac761cc81eb0246"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Estado Global de la App
        const State = {
            orders: [],
            inventory: [],
            inventoryFilter: 'prendas',
            listeners: {} // Para suscripciones en tiempo real
        };

        // ==========================================
        // CAPA 1: SERVICIOS DE DATOS (DATA LAYER)
        // ==========================================
        const DataService = {
            // Escuchar cambios en tiempo real (Velocidad de luz)
            initListeners: () => {
                // Escuchar Órdenes
                const qOrders = query(collection(db, "orders"), orderBy("date", "asc"));
                State.listeners.orders = onSnapshot(qOrders, (snapshot) => {
                    State.orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    App.UI.renderOrders();
                    App.UI.renderDashboard();
                });

                // Escuchar Inventario
                State.listeners.inventory = onSnapshot(collection(db, "inventory"), (snapshot) => {
                    State.inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    App.UI.renderInventory();
                });
            },

            // Subir Fotos a Firebase Storage
            uploadPhoto: async (file, path) => {
                if(!file) return null;
                const storageRef = ref(storage, `${path}/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(storageRef, file);
                return await getDownloadURL(snapshot.ref);
            },

            // Operaciones CRUD Genéricas
            saveOrder: async (orderData) => {
                if(orderData.id) {
                    await updateDoc(doc(db, "orders", orderData.id), orderData);
                } else {
                    await addDoc(collection(db, "orders"), orderData);
                }
            },
            deleteOrder: async (id) => await deleteDoc(doc(db, "orders", id)),
            
            saveProduct: async (prodData) => await addDoc(collection(db, "inventory"), prodData),
            updateProduct: async (id, data) => await updateDoc(doc(db, "inventory", id), data)
        };

        // ==========================================
        // CAPA 2: LÓGICA DE NEGOCIO (CONTROLLER)
        // ==========================================
        const Logic = {
            init: () => {
                DataService.initListeners();
                setTimeout(() => document.getElementById('app-loader').style.display = 'none', 1000);
            },

            // --- Lógica de Órdenes ---
            Orders: {
                create: () => { App.UI.Modals.orderEditor(); },
                edit: (id) => { 
                    const order = State.orders.find(o => o.id === id);
                    App.UI.Modals.orderEditor(order); 
                },
                save: async (id) => {
                    try {
                        const btn = document.getElementById('btn-save-order');
                        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
                        
                        // Recolectar datos del DOM
                        const data = {
                            number: document.getElementById('inp-number').value,
                            client: document.getElementById('inp-client').value,
                            date: document.getElementById('inp-date').value,
                            notes: document.getElementById('inp-notes').value,
                            invoice: document.getElementById('inp-invoice').value,
                            bultos: document.getElementById('inp-bultos').value,
                            items: Logic.Orders.collectItemsFromDOM(),
                            status: id ? (State.orders.find(o=>o.id===id).status || 'Pendiente') : 'Pendiente'
                        };

                        if(id) data.id = id;
                        await DataService.saveOrder(data);
                        App.UI.closeModal();
                        Swal.fire({ icon: 'success', title: 'Guardado', timer: 1500, showConfirmButton: false });
                    } catch (e) {
                        console.error(e);
                        Swal.fire('Error', 'No se pudo guardar. Revisa tu conexión.', 'error');
                    }
                },
                collectItemsFromDOM: () => {
                    const rows = document.querySelectorAll('.item-row');
                    return Array.from(rows).map(row => ({
                        product: row.querySelector('.inp-prod').value,
                        qty: row.querySelector('.inp-qty').value
                    })).filter(i => i.product);
                },
                delete: async (id) => {
                    const res = await Swal.fire({ title: '¿Borrar Orden?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Sí, borrar' });
                    if(res.isConfirmed) await DataService.deleteOrder(id);
                },
                
                // INTRANSABLE: Reporte de Fallas con Foto
                reportIssue: async (id) => {
                    const { value: file } = await Swal.fire({
                        title: 'Reportar Falla / Incidencia',
                        text: 'Sube una foto del defecto obligatoriamente.',
                        input: 'file',
                        inputAttributes: { 'accept': 'image/*', 'aria-label': 'Sube la foto' },
                        showCancelButton: true
                    });

                    if (file) {
                        Swal.showLoading();
                        const url = await DataService.uploadPhoto(file, 'issues');
                        await DataService.saveOrder({ id, hasIssue: true, issuePhoto: url });
                        Swal.fire('Reportado', 'La orden quedó marcada en ROJO.', 'warning');
                    }
                },

                // INTRANSABLE: Despacho con Foto
                dispatch: async (id) => {
                    const { value: file } = await Swal.fire({
                        title: 'Validar Despacho',
                        text: 'Sube foto de la etiqueta o bulto cerrado.',
                        input: 'file',
                        inputAttributes: { 'accept': 'image/*', 'aria-label': 'Sube la foto' },
                        showCancelButton: true,
                        confirmButtonText: 'Confirmar Despacho'
                    });

                    if (file) {
                        Swal.showLoading();
                        const url = await DataService.uploadPhoto(file, 'dispatches');
                        await DataService.saveOrder({ id, status: 'Despachado', dispatchPhoto: url });
                        Swal.fire('¡Éxito!', 'Orden despachada correctamente.', 'success');
                    }
                }
            },

            // --- Lógica de Inventario ---
            Inventory: {
                switchTab: (type) => {
                    State.inventoryFilter = type;
                    document.getElementById('tab-prendas').className = `flex-1 py-2 rounded-lg font-bold text-sm transition-all ${type==='prendas'?'bg-white shadow text-slate-800':'text-slate-500'}`;
                    document.getElementById('tab-telas').className = `flex-1 py-2 rounded-lg font-bold text-sm transition-all ${type==='telas'?'bg-white shadow text-slate-800':'text-slate-500'}`;
                    App.UI.renderInventory();
                },
                createProduct: async () => {
                    const { value: formValues } = await Swal.fire({
                        title: 'Nuevo Producto',
                        html: `
                            <input id="swal-prod" class="swal2-input" placeholder="Nombre (ej: Polera Piqué)">
                            <select id="swal-type" class="swal2-input"><option value="prendas">Prenda</option><option value="telas">Tela</option></select>
                        `,
                        focusConfirm: false,
                        preConfirm: () => [document.getElementById('swal-prod').value, document.getElementById('swal-type').value]
                    });
                    if(formValues) await DataService.saveProduct({ name: formValues[0], type: formValues[1], stock: 0, history: [] });
                },
                moveStock: async (id, currentStock) => {
                    // Kardex con Foto
                    const prod = State.inventory.find(p => p.id === id);
                    App.UI.Modals.stockMover(prod);
                },
                saveMove: async (id, isEntry) => {
                    const qty = parseFloat(document.getElementById('mv-qty').value);
                    const note = document.getElementById('mv-note').value;
                    const file = document.getElementById('mv-file').files[0];
                    
                    if(!qty || !file) return Swal.fire('Faltan datos', 'Cantidad y FOTO son obligatorios', 'error');
                    
                    Swal.showLoading();
                    const url = await DataService.uploadPhoto(file, 'kardex');
                    const prod = State.inventory.find(p => p.id === id);
                    
                    const newStock = isEntry ? (parseFloat(prod.stock || 0) + qty) : (parseFloat(prod.stock || 0) - qty);
                    const movement = {
                        date: new Date().toISOString(),
                        type: isEntry ? 'Entrada' : 'Salida',
                        qty: qty,
                        note: note,
                        photo: url,
                        user: 'Admin' 
                    };

                    const history = prod.history || [];
                    history.unshift(movement); // Agregar al principio

                    await DataService.updateProduct(id, { stock: newStock, history: history });
                    App.UI.closeModal();
                    Swal.fire('Registrado', 'Movimiento guardado con evidencia.', 'success');
                }
            }
        };

        // ==========================================
        // CAPA 3: INTERFAZ DE USUARIO (VIEW)
        // ==========================================
        const UI = {
            navigate: (viewId) => {
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(`view-${viewId}`).classList.remove('hidden');
                
                // Actualizar menú móvil y desktop
                document.querySelectorAll('.nav-mobile').forEach(btn => {
                    btn.classList.toggle('text-blue-600', btn.dataset.target === viewId);
                    btn.classList.toggle('text-slate-400', btn.dataset.target !== viewId);
                });
            },

            renderDashboard: () => {
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = '';
                const days = ['L','M','M','J','V','S','D'];
                days.forEach(d => grid.innerHTML += `<div class="text-center text-xs font-bold text-slate-300 py-2">${d}</div>`);
                
                // Lógica simple de calendario para visualización
                for(let i=1; i<=30; i++) {
                    // Buscar si hay entrega este día
                    const hasDelivery = State.orders.some(o => {
                        if(!o.date) return false;
                        const d = parseInt(o.date.split('-')[2]);
                        return d === i && o.status !== 'Despachado';
                    });
                    
                    grid.innerHTML += `
                        <div class="aspect-square rounded-lg flex flex-col items-center justify-center border ${hasDelivery ? 'bg-blue-50 border-blue-200' : 'bg-white border-transparent'}">
                            <span class="text-sm ${hasDelivery ? 'font-bold text-blue-600' : 'text-slate-500'}">${i}</span>
                            ${hasDelivery ? '<div class="w-1.5 h-1.5 bg-orange-500 rounded-full mt-1"></div>' : ''}
                        </div>
                    `;
                }

                // Lista de próximos
                const list = document.getElementById('upcoming-list');
                list.innerHTML = '';
                State.orders.filter(o => o.status !== 'Despachado').slice(0,3).forEach(o => {
                    list.innerHTML += `
                        <div class="ios-card p-4 border-l-4 border-orange-400 flex justify-between items-center">
                            <div>
                                <div class="font-bold text-slate-700">${o.client}</div>
                                <div class="text-xs text-slate-400">#${o.number} • ${o.date}</div>
                            </div>
                            <span class="text-xs font-bold text-orange-500 bg-orange-50 px-2 py-1 rounded">Pendiente</span>
                        </div>
                    `;
                });
            },

            renderOrders: () => {
                const container = document.getElementById('orders-list');
                const term = document.getElementById('search-orders').value.toLowerCase();
                container.innerHTML = '';

                State.orders.filter(o => 
                    (o.client || '').toLowerCase().includes(term) || (o.number || '').includes(term)
                ).forEach(o => {
                    const isPending = o.status !== 'Despachado';
                    const hasIssue = o.hasIssue;
                    let border = isPending ? 'border-orange-500' : 'border-green-500';
                    let icon = isPending ? 'fa-clock text-orange-500' : 'fa-check-circle text-green-500';
                    if(hasIssue) { border = 'border-red-500'; icon = 'fa-exclamation-triangle text-red-500'; }

                    container.innerHTML += `
                        <div class="ios-card p-5 border-l-4 ${border} relative overflow-hidden tap-effect">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-black text-lg text-slate-800">#${o.number} <span class="text-sm font-normal text-slate-500">| ${o.client}</span></h3>
                                    <p class="text-xs font-bold text-slate-400 mt-0.5"><i class="fas fa-calendar mr-1"></i> ${o.date || 'Sin fecha'}</p>
                                </div>
                                <div class="flex flex-col items-end gap-2">
                                    <i class="fas ${icon} text-2xl"></i>
                                </div>
                            </div>
                            <div class="flex gap-2 mt-4 pt-3 border-t border-slate-100">
                                <button onclick="App.Logic.Orders.edit('${o.id}')" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">Ver / Editar</button>
                                ${isPending ? `<button onclick="App.Logic.Orders.dispatch('${o.id}')" class="flex-1 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">Despachar</button>` : ''}
                            </div>
                        </div>
                    `;
                });
            },

            renderInventory: () => {
                const container = document.getElementById('inventory-grid');
                container.innerHTML = '';
                const items = State.inventory.filter(i => i.type === State.inventoryFilter);
                
                items.forEach(p => {
                    container.innerHTML += `
                        <div class="ios-card p-5 flex flex-col justify-between h-full">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h4 class="font-bold text-lg text-slate-700 leading-tight">${p.name}</h4>
                                    <span class="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-400 uppercase">${p.type}</span>
                                </div>
                                <div class="mt-4 mb-4">
                                    <span class="text-4xl font-black text-slate-800">${p.stock || 0}</span>
                                    <span class="text-sm font-bold text-slate-400">${p.type === 'telas' ? 'Metros' : 'Unid.'}</span>
                                </div>
                            </div>
                            <button onclick="App.Logic.Inventory.moveStock('${p.id}')" class="w-full py-3 bg-blue-50 text-blue-600 rounded-xl font-bold text-sm hover:bg-blue-100 transition-colors">
                                Registrar Movimiento
                            </button>
                        </div>
                    `;
                });
            },

            Modals: {
                orderEditor: (order = null) => {
                    document.getElementById('modal-title').innerText = order ? `Editar Orden #${order.number}` : 'Nueva Orden';
                    const itemsHtml = (order?.items || []).map(i => `
                        <div class="item-row flex gap-2 mb-2">
                            <input class="ios-input inp-prod text-sm" value="${i.product}" placeholder="Producto">
                            <input class="ios-input inp-qty w-24 text-center" type="number" value="${i.qty}" placeholder="#">
                            <button onclick="this.parentElement.remove()" class="text-red-400 px-2"><i class="fas fa-times"></i></button>
                        </div>
                    `).join('');

                    document.getElementById('modal-body').innerHTML = `
                        <div class="space-y-4">
                            <div class="grid grid-cols-3 gap-3">
                                <div class="col-span-1"><label class="text-xs font-bold text-slate-400">NÚMERO</label><input id="inp-number" type="number" class="ios-input font-bold text-blue-600" value="${order?.number || ''}"></div>
                                <div class="col-span-2"><label class="text-xs font-bold text-slate-400">CLIENTE</label><input id="inp-client" class="ios-input font-bold" value="${order?.client || ''}"></div>
                            </div>
                            <div><label class="text-xs font-bold text-slate-400">FECHA ENTREGA</label><input type="date" id="inp-date" class="ios-input" value="${order?.date || ''}"></div>
                            
                            <div class="bg-white p-3 rounded-xl border border-slate-200">
                                <div class="flex justify-between mb-2"><label class="text-xs font-bold text-slate-400">PRODUCTOS</label><button onclick="App.UI.addTempItem()" class="text-blue-500 text-xs font-bold">+ Item</button></div>
                                <div id="items-container">${itemsHtml}</div>
                            </div>

                            <div><label class="text-xs font-bold text-slate-400">NOTAS GENERALES</label><textarea id="inp-notes" class="ios-input h-20" placeholder="Instrucciones...">${order?.notes || ''}</textarea></div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-xs font-bold text-slate-400">FACTURA</label><input id="inp-invoice" class="ios-input" value="${order?.invoice || ''}"></div>
                                <div><label class="text-xs font-bold text-slate-400">BULTOS</label><input id="inp-bultos" type="number" class="ios-input" value="${order?.bultos || ''}"></div>
                            </div>

                            ${order ? `
                            <div class="flex gap-2 pt-4 border-t border-slate-200">
                                <button onclick="App.Logic.Orders.reportIssue('${order.id}')" class="flex-1 py-3 bg-red-50 text-red-500 rounded-xl font-bold text-sm"><i class="fas fa-camera mr-2"></i>Reportar Falla</button>
                                <button onclick="App.Logic.Orders.delete('${order.id}')" class="w-12 bg-slate-100 text-slate-400 rounded-xl"><i class="fas fa-trash"></i></button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                    document.getElementById('modal-footer').innerHTML = `
                        <button onclick="App.Logic.Orders.save('${order?.id || ''}')" id="btn-save-order" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold text-lg shadow-xl shadow-slate-300">GUARDAR ORDEN</button>
                    `;
                    App.UI.openModal();
                },

                stockMover: (prod) => {
                    document.getElementById('modal-title').innerText = prod.name;
                    // Historial
                    const historyHtml = (prod.history || []).slice(0,5).map(h => `
                        <div class="flex justify-between items-center text-xs p-2 border-b border-slate-100">
                            <div><span class="font-bold ${h.type==='Entrada'?'text-green-600':'text-red-500'}">${h.type}</span> <span class="text-slate-400">(${h.qty})</span></div>
                            <div class="flex items-center gap-2">
                                <span class="text-slate-400">${h.note || '-'}</span>
                                <a href="${h.photo}" target="_blank" class="text-blue-500"><i class="fas fa-image"></i></a>
                            </div>
                        </div>
                    `).join('');

                    document.getElementById('modal-body').innerHTML = `
                        <div class="text-center mb-6">
                            <h2 class="text-5xl font-black text-slate-800">${prod.stock}</h2>
                            <p class="text-xs font-bold text-slate-400 uppercase">Stock Actual</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
                            <label class="text-xs font-bold text-slate-400 uppercase block mb-2">Registrar Nuevo Movimiento</label>
                            <input id="mv-qty" type="number" class="ios-input mb-3 text-center text-xl font-bold" placeholder="Cantidad">
                            <input id="mv-note" type="text" class="ios-input mb-3" placeholder="Responsable / Nota (Ej: Taller Yolanda)">
                            <div class="p-4 border-2 border-dashed border-slate-300 rounded-xl text-center relative bg-slate-50">
                                <i class="fas fa-camera text-slate-400 mb-2"></i>
                                <p class="text-xs font-bold text-slate-500">FOTO EVIDENCIA (OBLIGATORIA)</p>
                                <input type="file" id="mv-file" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" accept="image/*">
                            </div>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 mb-2 uppercase">Historial Reciente</p>
                            ${historyHtml || '<p class="text-xs text-slate-300 italic">Sin movimientos</p>'}
                        </div>
                    `;
                    document.getElementById('modal-footer').innerHTML = `
                        <div class="flex gap-3">
                            <button onclick="App.Logic.Inventory.saveMove('${prod.id}', true)" class="flex-1 py-4 bg-green-500 text-white rounded-xl font-bold shadow-lg shadow-green-200">ENTRADA</button>
                            <button onclick="App.Logic.Inventory.saveMove('${prod.id}', false)" class="flex-1 py-4 bg-red-500 text-white rounded-xl font-bold shadow-lg shadow-red-200">SALIDA</button>
                        </div>
                    `;
                    App.UI.openModal();
                }
            },

            addTempItem: () => {
                const div = document.createElement('div');
                div.className = 'item-row flex gap-2 mb-2 animate-fade-in';
                div.innerHTML = `
                    <input class="ios-input inp-prod text-sm" placeholder="Producto">
                    <input class="ios-input inp-qty w-24 text-center" type="number" placeholder="#">
                    <button onclick="this.parentElement.remove()" class="text-red-400 px-2"><i class="fas fa-times"></i></button>
                `;
                document.getElementById('items-container').appendChild(div);
            },

            openModal: () => document.getElementById('universal-modal').classList.remove('hidden'),
            closeModal: () => document.getElementById('universal-modal').classList.add('hidden')
        };

        // Exponer al Global Scope para usar onclick en HTML
        window.App = { Logic, UI };
        
        // INICIO AUTOMÁTICO
        Logic.init();

    </script>
</body>
</html>
